[project]
name = "stoke"
version = "1.3.0"
description = "A股量化投研数据层 — 覆盖行情/研报/信号/新闻/基础数据/公告 6 大层面"
requires-python = ">=3.11"
dependencies = [
    "akshare>=1.18.60",
    "mootdx>=0.11.7",
    "pandas>=3.0.3",
    "requests>=2.34.2",
]

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"
