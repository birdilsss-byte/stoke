[project]
name = "stoke"
version = "1.3.0"
description = "A股量化投研数据层 — 覆盖行情/研报/信号/新闻/基础数据/公告 6 大层面"
requires-python = ">=3.11"
dependencies = [
    "akshare>=1.18.60",
    "baostock>=0.9.1",
    "beautifulsoup4>=4.12.0",
    "efinance>=0.5.8",
    "mootdx>=0.11.7",
    "pandas>=2.0.0",
    "requests>=2.34.2",
]

[tool.setuptools.packages.find]
exclude = ["Team*"]

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"
